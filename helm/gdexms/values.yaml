# One pod is plenty for ~50 staff, and the shared rda namespace has a 40-pod quota
# (pod-limit). Pods share state only through the signed session cookie.
replicaCount: 1

webapp:
  name: gdexms                            # Name for k8s objects
  group: gdexms                           # Group label for related resources
  path: /                                 # URL path suffix
  tls:
    # CIRRUS FQDNs end in .k8s.ucar.edu today; gdexms.gdex.ucar.edu is the planned
    # name once CIRRUS can write *.gdex.ucar.edu records. The OIDC redirect URI
    # (https://<fqdn>/auth/callback) must match whichever is used.
    fqdn: gdexms.k8s.ucar.edu
    secretName: incommon-cert-gdexms      # Unique TLS secret name for the FQDN
  ingress:
    visibility: internal                  # internal = UCAR network/VPN only
  container:
    image: hub.k8s.ucar.edu/gdex/gdexms:1.0.0     # version of an image built by a GitHub release v<version>
    port: 8080                            # gunicorn port (see Dockerfile)
    requests:
      memory: 256M
      cpu: 0.25
    limits:
      memory: 512M
      cpu: 1
  # Plain (non-secret) env vars. None needed for the database: rda_python_common already
  # defaults to host rda-db.ucar.edu and database rdadb (override with DSSDBHOST / DBNAME).
  env:
    GDEXMS_LOGPATH: "-"                  # app log to stdout/stderr -> Loki / kubectl logs
    # Entra ID sign-in (see src/gdex_python_gdexms/auth.py); app registration by UCAR IT
    OIDC_TENANT_ID: "a85e7773-09e6-4cce-aa58-664ddb1aca42"   # UCAR Entra directory (tenant) ID
    OIDC_USERNAME_CLAIM: preferred_username                  # claim holding <logname>@ucar.edu
    OIDC_ALLOWED_GROUP: "5bbe939c-b1b3-4819-b66f-0ed98c06623d"   # gdexms-users group object ID (groups claim in ID token)
  # After changing a value in OpenBao, bump this to re-read the secrets and restart the pod
  # (no Argo CD actions needed; the ExternalSecret otherwise re-reads OpenBao hourly).
  secretsVersion: 2
  secretStore: rda-ro                     # CIRRUS SecretStore for everything under kv/gdex (per Nick)
  # Each entry maps one OpenBao path/property to an env var in the container.
  # Paths are under kv/gdex. Existing secrets keep their paths (kv/gdex/pgdb01); the app's
  # own secrets go in kv/gdex/gdexms, which GDEX writes itself. Every property listed here
  # must exist in OpenBao, or the ExternalSecret fails to sync and the pods cannot start.
  secrets:
    - envVar: FLASK_SECRET_KEY            # Signs session cookies; same value on all replicas
      path: gdex/gdexms
      property: flask_secret_key
    - envVar: OIDC_CLIENT_ID              # Entra ID application (client) ID; turns sign-in on
      path: gdex/gdexms
      property: oidc_client_id
    - envVar: OIDC_CLIENT_SECRET          # expires 2028-11-22; IT emails a reminder beforehand
      path: gdex/gdexms
      property: oidc_client_secret
    - envVar: PGDB01_DSSDBPASS            # dssdb password; rda_python_common reads <NODE>_<KEY>
      path: gdex/pgdb01
      property: dssdbpass
