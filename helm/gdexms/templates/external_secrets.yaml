apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.webapp.name }}-esos
  namespace: {{ .Release.Namespace }}
  annotations:
    # a changed value makes the External Secrets operator re-read OpenBao at once
    force-sync: {{ .Values.webapp.secretsVersion | quote }}
    # Argo CD syncs this (and waits for it to be healthy) before the Deployment, so pods
    # started by a secretsVersion bump read the refreshed Secret
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.webapp.secretStore }}
    kind: SecretStore
  target:
    name: {{ .Values.webapp.name }}-esos
  data:
  {{- range .Values.webapp.secrets }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .path }}
        property: {{ .property }}
  {{- end }}
