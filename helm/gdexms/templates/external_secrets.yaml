apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.webapp.name }}-esos
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.webapp.secretStore }}
    kind: SecretStore
  target:
    name: {{ .Values.webapp.name }}-esos
  data:
  {{- range .Values.webapp.secrets }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .path }}
        property: {{ .property }}
  {{- end }}
