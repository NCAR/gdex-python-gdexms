# Build the gdexms container image and push it to the CIRRUS registry (hub.k8s.ucar.edu).
# Based on NCAR/cirrus-examples github-workflows/build-push-image.yaml, but runs on a
# GitHub-hosted runner (ubuntu-latest) with the default buildx builder, as CIRRUS advised
# for small builds; no CIRRUS runner or remote buildkit is needed.
#
# Runs when a GitHub release is published (tag v<version>, e.g. v1.0.1), or by hand on such
# a tag ("Use workflow from" -> the tag), never on pull_request / pull_request_target.
# The image is tagged with the version: hub.k8s.ucar.edu/gdex/gdexms:1.0.1. The run fails
# unless the tag is on main, matches the version in pyproject.toml and __init__.py, and
# that image tag does not exist yet (a pushed version is never overwritten).
# Third-party actions are pinned to commit hashes.
#
# Releasing: bump the version in pyproject.toml and src/gdex_python_gdexms/__init__.py,
# PR to main, merge, create release v<version> on main; once the image is pushed, set the
# tag in helm/gdexms/values.yaml (PR, merge; Argo CD deploys it).
#
# Repository secrets needed (CIRRUS registry robot account for the gdex project):
#   hub_user, hub_password
# Until both are set, the run succeeds without building and shows a notice.

name: Build and push image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-image
  cancel-in-progress: false

env:
  IMAGE: hub.k8s.ucar.edu/gdex/gdexms

jobs:
  build:
    if: github.repository == 'NCAR/gdex-python-gdexms' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Check registry secrets
      id: check
      env:
        HUB_USER: ${{ secrets.hub_user }}
        HUB_PASSWORD: ${{ secrets.hub_password }}
      run: |
        if [ -n "$HUB_USER" ] && [ -n "$HUB_PASSWORD" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::hub_user/hub_password secrets are not set; skipping the image build."
        fi

    - name: Check out code
      if: steps.check.outputs.ready == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Check the release tag and version
      if: steps.check.outputs.ready == 'true'
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        PYPROJECT=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
        INIT=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/gdex_python_gdexms/__init__.py)
        if [ "$VERSION" != "$PYPROJECT" ] || [ "$VERSION" != "$INIT" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml ($PYPROJECT) and __init__.py ($INIT)"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::tag $GITHUB_REF_NAME is not on main"
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      if: steps.check.outputs.ready == 'true'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

    - name: Log in to the CIRRUS registry
      if: steps.check.outputs.ready == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: hub.k8s.ucar.edu
        username: ${{ secrets.hub_user }}
        password: ${{ secrets.hub_password }}

    - name: Refuse to overwrite a pushed version
      if: steps.check.outputs.ready == 'true'
      run: |
        if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
          echo "::error::$IMAGE:$VERSION already exists; bump the version for a new image"
          exit 1
        fi

    # Start the image and wait for /healthz before pushing, so an image whose
    # workers cannot boot (e.g. a missing library) never reaches the registry
    - name: Build image for the smoke test
      if: steps.check.outputs.ready == 'true'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        load: true
        tags: gdexms:smoke
        cache-from: type=registry,ref=${{ env.IMAGE }}:cache

    - name: Smoke test (container starts and answers /healthz)
      if: steps.check.outputs.ready == 'true'
      run: |
        docker run -d --name gdexms -p 8080:8080 gdexms:smoke
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8080/healthz; then echo; docker rm -f gdexms; exit 0; fi
          sleep 2
        done
        echo "::error::gdexms container did not answer /healthz"
        docker logs gdexms
        exit 1

    - name: Build and push
      if: steps.check.outputs.ready == 'true'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ env.IMAGE }}:${{ env.VERSION }}
        cache-from: type=registry,ref=${{ env.IMAGE }}:cache
        cache-to: type=registry,ref=${{ env.IMAGE }}:cache,image-manifest=true,mode=max
